[package]
name = "revizor-win-sender"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Revizor Windows sender: WGC capture -> GPU colour conversion -> hardware H.264 (Media Foundation) -> encrypted network stream, with a local web UI."

[[bin]]
name = "revizor-sender"
path = "src/main.rs"

[dependencies]
revizor-proto = { path = "../revizor-proto" }
revizor-crypto = { path = "../revizor-crypto" }
revizor-session = { path = "../revizor-session" }
revizor-transport = { path = "../revizor-transport" }
revizor-adaptive = { path = "../revizor-adaptive" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
rand = "0.8"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Threading",
]

[workspace]
# standalone: built with `cargo build --release --target x86_64-pc-windows-msvc` on Windows
